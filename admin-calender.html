<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Pesanan - Admin CaterFlow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            brown: '#3A1C0E',
                            dark: '#2D1A10',
                            terracota: '#C07047',
                            cream: '#FAF4EE',
                            creamDark: '#E8D9CD',
                            muted: '#7A6558'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-cream font-sans text-brand-dark antialiased">

    <div class="min-h-screen flex">
        <!-- SIDEBAR ADMIN -->
        <aside class="w-64 bg-brand-brown text-white fixed h-full left-0 top-0 z-30 p-6 flex flex-col justify-between">
            <div>
                <a href="admin-dashboard.html" class="text-2xl font-bold text-white flex items-center gap-3 mb-8">
                    <img src="assets/img/logo.jpg" alt="Logo CaterFlow" class="h-10 w-10 rounded-full object-cover">
                    <span>CaterFlow</span>
                </a>

                <div class="flex items-center gap-3 pb-6 mb-6 border-b border-white/10">
                    <div class="w-10 h-10 rounded-full bg-[#C07047] text-white flex items-center justify-center font-bold text-xs">CF</div>
                    <div>
                        <h4 class="text-xs font-bold text-white">CaterFlow Admin</h4>
                        <small class="text-[10px] text-[#A88B7D]">Administrator</small>
                    </div>
                </div>

                <nav class="space-y-2">
                    <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-[#D4B9AC] hover:bg-brand-terracota/80 hover:text-white font-medium text-xs transition-all">
                        <i class="fa-solid fa-house w-4"></i> Dashboard
                    </a>
                    <a href="admin-orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-[#D4B9AC] hover:bg-brand-terracota/80 hover:text-white font-medium text-xs transition-all">
                        <i class="fa-solid fa-box-archive w-4"></i> Daftar Pesanan
                    </a>
                    <a href="admin-calendar.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-brand-terracota text-white font-semibold text-xs transition-all shadow-sm">
                        <i class="fa-regular fa-calendar-days w-4"></i> Kalender
                    </a>
                    <a href="admin-cashflow.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-[#D4B9AC] hover:bg-brand-terracota/80 hover:text-white font-medium text-xs transition-all">
                        <i class="fa-solid fa-receipt w-4"></i> Pencatatan Kas
                    </a>
                    <a href="admin-inquiries.html" class="flex items-center justify-between px-4 py-3 rounded-xl text-[#D4B9AC] hover:bg-brand-terracota/80 hover:text-white font-medium text-xs transition-all">
                        <div class="flex items-center gap-3">
                            <i class="fa-regular fa-envelope w-4"></i> Pertanyaan Masuk
                        </div>
                        <span class="bg-white text-brand-brown text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</span>
                    </a>
                    <a href="admin-menu.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-[#D4B9AC] hover:bg-brand-terracota/80 hover:text-white font-medium text-xs transition-all">
                        <i class="fa-solid fa-bars-staggered w-4"></i> Kelola Menu
                    </a>
                </nav>
            </div>

            <div class="pt-4 border-t border-white/10">
                <a href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-[#E6AA8E] hover:bg-white/10 hover:text-white font-medium text-xs transition-all">
                    <i class="fa-solid fa-right-from-bracket w-4"></i> Keluar
                </a>
            </div>
        </aside>

        <!-- KONTEN UTAMA KALENDER -->
        <main class="ml-64 flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <small class="text-[11px] text-brand-muted">Panel Admin</small>
                    <h2 class="font-bold text-xs text-brand-brown">Kalender</h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-white border border-brand-creamDark flex items-center justify-center text-brand-brown"><i class="fa-regular fa-image text-xs"></i></div>
                    <div class="w-9 h-9 rounded-full bg-brand-terracota text-white flex items-center justify-center font-bold text-xs">CF</div>
                </div>
            </div>

            <div class="flex items-center justify-between mb-8">
                <h1 class="font-serif text-3xl md:text-4xl text-brand-brown">Kalender Pesanan</h1>
                <div class="flex items-center gap-3">
                    <button onclick="openModal()" class="px-5 py-2.5 bg-brand-terracota hover:bg-[#A85E38] text-white text-xs font-semibold rounded-2xl shadow-sm transition-all flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Tambah Jadwal
                    </button>
                    <!-- TOGGLE VIEW MODE (BULANAN / MINGGUAN) -->
                    <div class="bg-white border border-brand-creamDark p-1 rounded-2xl flex text-xs">
                        <button id="btn-monthly" onclick="switchView('monthly')" class="px-4 py-1.5 bg-brand-brown text-white font-semibold rounded-xl transition-all">Bulanan</button>
                        <button id="btn-weekly" onclick="switchView('weekly')" class="px-4 py-1.5 text-brand-muted font-medium hover:text-brand-brown transition-all">Mingguan</button>
                    </div>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="bg-white rounded-3xl p-6 border border-brand-creamDark shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="w-full md:w-1/2">
                    <label class="block text-[11px] font-semibold text-brand-brown mb-1.5">Cari jadwal</label>
                    <input type="text" id="search-input" oninput="renderCalendar()" placeholder="Nama pelanggan, ID, atau menu..." class="w-full px-4 py-2.5 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota">
                </div>
                <div class="w-full md:w-1/3">
                    <label class="block text-[11px] font-semibold text-brand-brown mb-1.5">Status pesanan</label>
                    <select id="status-filter" onchange="renderCalendar()" class="w-full px-4 py-2.5 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota bg-white">
                        <option value="Semua">Semua Status</option>
                        <option value="Pending">Pending</option>
                        <option value="DP">DP (Uang Muka)</option>
                        <option value="Lunas">Lunas</option>
                        <option value="Selesai">Selesai</option>
                    </select>
                </div>
                <div class="text-right">
                    <span id="total-count" class="text-lg font-bold text-brand-brown block">0</span>
                    <small class="text-[10px] text-brand-muted">jadwal ditampilkan</small>
                </div>
            </div>

            <!-- NAVIGASI TANGGAL & GRID KALENDER -->
            <div class="bg-white rounded-3xl border border-brand-creamDark shadow-sm overflow-hidden">
                <div class="p-6 border-b border-brand-creamDark flex items-center gap-4">
                    <button onclick="navigateDate(-1)" class="w-8 h-8 rounded-full border border-brand-creamDark flex items-center justify-center text-brand-brown hover:bg-brand-cream transition-all">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <h3 id="current-period-text" class="font-serif text-2xl font-bold text-brand-brown">November 2026</h3>
                    <button onclick="navigateDate(1)" class="w-8 h-8 rounded-full border border-brand-creamDark flex items-center justify-center text-brand-brown hover:bg-brand-cream transition-all">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- DYNAMIC GRID KALENDER -->
                <div class="grid grid-cols-7 text-center border-b border-brand-creamDark bg-brand-cream/30 text-xs font-semibold text-brand-muted py-3">
                    <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr bg-brand-creamDark/20 gap-[1px]">
                    <!-- Tampilan grid di-render dinamis sesuai mode (Bulanan / Mingguan) -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL POP-UP TAMBAH JADWAL -->
    <div id="scheduleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 border border-brand-creamDark shadow-xl">
            <div class="flex justify-between items-center pb-4 border-b border-brand-creamDark mb-4">
                <h3 class="font-serif text-xl font-bold text-brand-brown">Tambah Jadwal Katering</h3>
                <button onclick="closeModal()" class="text-brand-muted hover:text-brand-brown"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="saveSchedule(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-brand-brown mb-1">Nama Pemesan / Acara</label>
                    <input type="text" id="input-name" required placeholder="Contoh: Acara Syukuran Alya" class="w-full px-4 py-2.5 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-brand-brown mb-1">Tanggal</label>
                        <input type="date" id="input-date" required class="w-full px-3 py-2 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-brand-brown mb-1">Jam Acara</label>
                        <input type="time" id="input-time" required class="w-full px-3 py-2 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-brand-brown mb-1">Pilih Menu</label>
                        <select id="input-menu" class="w-full px-3 py-2.5 rounded-xl border border-brand-creamDark text-xs bg-white focus:outline-none focus:border-brand-terracota">
                            <option>Nasi Box Nusantara</option>
                            <option>Snack Box Senja</option>
                            <option>Prasmanan Saji Keluarga</option>
                            <option>Dessert Box Cokelat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-brand-brown mb-1">Status Pesanan</label>
                        <select id="input-status" class="w-full px-3 py-2.5 rounded-xl border border-brand-creamDark text-xs bg-white focus:outline-none focus:border-brand-terracota font-semibold">
                            <option value="Pending">Pending</option>
                            <option value="DP">DP</option>
                            <option value="Lunas">Lunas</option>
                            <option value="Selesai">Selesai</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-brown mb-1">Jumlah Porsi</label>
                    <input type="number" id="input-portion" min="1" placeholder="50" class="w-full px-4 py-2.5 rounded-xl border border-brand-creamDark text-xs focus:outline-none focus:border-brand-terracota">
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-brand-creamDark text-xs font-semibold text-brand-muted hover:bg-brand-cream">Batal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-brand-terracota hover:bg-[#A85E38] text-white text-xs font-semibold">Simpan Jadwal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIKA MODE BULANAN / MINGGUAN -->
    <script>
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let currentDate = new Date(2026, 10, 12); // Tanggal aktif awal
        let currentView = 'monthly'; // 'monthly' atau 'weekly'

        let schedules = [
            { id: 1, name: "Snack Box Senja", date: "2026-11-12", time: "09:00", menu: "Snack Box Senja", status: "DP", portion: 60 },
            { id: 2, name: "Nasi Box Nusantara", date: "2026-11-18", time: "11:00", menu: "Nasi Box Nusantara", status: "Pending", portion: 50 }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
        });

        // 1. Ganti Mode Tampilan (Bulanan vs Mingguan)
        function switchView(viewMode) {
            currentView = viewMode;
            const btnMonthly = document.getElementById('btn-monthly');
            const btnWeekly = document.getElementById('btn-weekly');

            if (viewMode === 'monthly') {
                btnMonthly.className = "px-4 py-1.5 bg-brand-brown text-white font-semibold rounded-xl transition-all";
                btnWeekly.className = "px-4 py-1.5 text-brand-muted font-medium hover:text-brand-brown transition-all";
            } else {
                btnWeekly.className = "px-4 py-1.5 bg-brand-brown text-white font-semibold rounded-xl transition-all";
                btnMonthly.className = "px-4 py-1.5 text-brand-muted font-medium hover:text-brand-brown transition-all";
            }
            renderCalendar();
        }

        // 2. Navigasi Panah Tanggal (Next/Prev Bulan atau Minggu)
        function navigateDate(dir) {
            if (currentView === 'monthly') {
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else {
                currentDate.setDate(currentDate.getDate() + (dir * 7));
            }
            renderCalendar();
        }

        // 3. Render Grid Utama
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const statusVal = document.getElementById('status-filter').value;
            let visibleCount = 0;

            if (currentView === 'monthly') {
                // RENDER MODE BULANAN
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                document.getElementById('current-period-text').innerText = `${months[month]} ${year}`;

                const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevTotalDays = new Date(year, month, 0).getDate();

                // Tanggal bulan sebelumnya
                for (let i = firstDayIndex; i > 0; i--) {
                    grid.innerHTML += `<div class="bg-white min-h-[110px] p-2 text-xs text-gray-300 font-medium">${prevTotalDays - i + 1}</div>`;
                }

                // Tanggal bulan aktif
                for (let day = 1; day <= totalDays; day++) {
                    const formattedDay = day < 10 ? '0' + day : day;
                    const formattedMonth = (month + 1) < 10 ? '0' + (month + 1) : (month + 1);
                    const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                    const daySchedules = schedules.filter(s => {
                        const matchDate = s.date === dateStr;
                        const matchSearch = s.name.toLowerCase().includes(searchVal) || s.menu.toLowerCase().includes(searchVal);
                        const matchStatus = statusVal === 'Semua' || s.status === statusVal;
                        return matchDate && matchSearch && matchStatus;
                    });

                    visibleCount += daySchedules.length;
                    const itemsHtml = generateScheduleBadges(daySchedules);

                    grid.innerHTML += `
                        <div class="bg-white min-h-[110px] p-2 text-xs font-semibold text-brand-dark flex flex-col justify-between">
                            <div>
                                <span>${day}</span>
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                }
            } else {
                // RENDER MODE MINGGUAN (7 HARI AKTIF)
                const currDayOfWeek = (currentDate.getDay() + 6) % 7; // Senin = 0
                const monday = new Date(currentDate);
                monday.setDate(currentDate.getDate() - currDayOfWeek);

                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);

                document.getElementById('current-period-text').innerText = 
                    `${monday.getDate()} ${months[monday.getMonth()]} - ${sunday.getDate()} ${months[sunday.getMonth()]} ${sunday.getFullYear()}`;

                for (let i = 0; i < 7; i++) {
                    const tempDate = new Date(monday);
                    tempDate.setDate(monday.getDate() + i);

                    const year = tempDate.getFullYear();
                    const month = tempDate.getMonth();
                    const day = tempDate.getDate();

                    const formattedDay = day < 10 ? '0' + day : day;
                    const formattedMonth = (month + 1) < 10 ? '0' + (month + 1) : (month + 1);
                    const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                    const daySchedules = schedules.filter(s => {
                        const matchDate = s.date === dateStr;
                        const matchSearch = s.name.toLowerCase().includes(searchVal) || s.menu.toLowerCase().includes(searchVal);
                        const matchStatus = statusVal === 'Semua' || s.status === statusVal;
                        return matchDate && matchSearch && matchStatus;
                    });

                    visibleCount += daySchedules.length;
                    const itemsHtml = generateScheduleBadges(daySchedules);

                    grid.innerHTML += `
                        <div class="bg-white min-h-[220px] p-3 text-xs font-semibold text-brand-dark flex flex-col justify-between border-t-2 border-brand-terracota/30">
                            <div>
                                <div class="flex justify-between items-center mb-2 pb-1 border-b border-brand-creamDark/50">
                                    <span class="text-brand-brown font-bold text-sm">${day}</span>
                                    <span class="text-[10px] text-brand-muted font-normal">${months[month].substring(0,3)}</span>
                                </div>
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('total-count').innerText = visibleCount;
        }

        // Helper Badge Warna per Status
        function generateScheduleBadges(daySchedules) {
            let itemsHtml = '';
            daySchedules.forEach(item => {
                let badgeBg = "bg-amber-50 border-amber-200 text-amber-900"; 
                if (item.status === 'DP') badgeBg = "bg-blue-50 border-blue-200 text-blue-900";
                if (item.status === 'Lunas') badgeBg = "bg-emerald-50 border-emerald-200 text-emerald-900";
                if (item.status === 'Selesai') badgeBg = "bg-gray-100 border-gray-300 text-gray-700";

                itemsHtml += `
                    <div class="mt-1 ${badgeBg} border p-1.5 rounded-lg text-[10px] shadow-sm">
                        <div class="flex justify-between font-bold">
                            <span>${item.time}</span>
                            <span class="uppercase text-[9px]">${item.status}</span>
                        </div>
                        <div class="truncate font-medium">${item.name}</div>
                    </div>
                `;
            });
            return itemsHtml;
        }

        function openModal() {
            document.getElementById('scheduleModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('scheduleModal').classList.add('hidden');
        }

        function saveSchedule(e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value;
            const date = document.getElementById('input-date').value;
            const time = document.getElementById('input-time').value;
            const menu = document.getElementById('input-menu').value;
            const status = document.getElementById('input-status').value;
            const portion = document.getElementById('input-portion').value;

            schedules.push({
                id: Date.now(),
                name: name,
                date: date,
                time: time,
                menu: menu,
                status: status,
                portion: portion
            });

            currentDate = new Date(date);
            renderCalendar();
            closeModal();
            e.target.reset();
        }
    </script>
</body>
</html>
